<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060f" />
    <meta
      name="description"
      content="見えないまま、正確に ── 0次元の点から6次元超立方体までを連続的に押し出す物語と、ホップ・ファイブレーションをはじめとする4展示で、人間の目が受けとれない高次元の構造を体験する可視化作品。"
    />
    <title>DIMENSION｜高次元を見る</title>

    <!-- OGP / Twitter Card。og:image は相対パス(vite の base: './' と揃える) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DIMENSION" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="DIMENSION｜高次元を見る" />
    <meta
      property="og:description"
      content="0次元の点から6次元超立方体へ。スクロールする物語と4つの展示で、見えない次元の構造を見る。"
    />
    <meta property="og:image" content="./og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ステレオ投影されたホップ・ファイブレーションの光の輪" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DIMENSION｜高次元を見る" />
    <meta
      name="twitter:description"
      content="0次元の点から6次元超立方体へ。スクロールする物語と4つの展示で、見えない次元の構造を見る。"
    />
    <!-- JS 無効時でも本文が読めるようにする(通常は fonts.ready が .fonts-ready を付ける) -->
    <noscript>
      <style>
        #narrative,
        .chapter-inner {
          opacity: 1 !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!--
      スキップリンク(Phase 14c)。**<body> の最初の子であることが要件**である ──
      タブ順は位置順なので、mountChrome() から差し込むと末尾に付いて意味をなさない。

      これは「ギャラリーを初回訪問者へ開示する」変更ではない。非開示の判断は
      **視覚的な注意の経済**についてのもので、:focus-visible でしか現れない要素は
      すでにキーボードで操作している人の視界にしか入らない。そして overlays.ts が
      伏せた章の CTA をタブ順から外した以上(Phase 14c)、キーボード / 支援技術の
      利用者に残る経路は 9 章 × 220svh の矢印キーだけになる ── それは非開示ではなく排除で、
      2 つは**セットで初めて中立**になる(ラベルの無い不可視の罠が、ラベルのある
      意図的な 1 つのコントロールに置き換わるだけ)。

      <a href="#…"> ではなく <button> なのは、行き先が文書内位置ではなくモード変更だから。
      href はハッシュを書いてフラグメントスクロールを誘発し、**物語の状態そのものである
      scrollY** を壊す(URL にハッシュを採らなかったのと同じ理由)。
    -->
    <button type="button" id="skip-gallery" class="skip">物語を飛ばしてギャラリーへ</button>

    <!--
      全画面の固定キャンバス。配置は style.css の #gl が担う。

      role="img" + **静的な** aria-label(Phase 14b)。これが無いあいだ、作品そのものが
      支援技術に対して存在していなかった。名前を状態に追従させないのは、
      非ライブ要素の名前の変化はどの支援技術でも確実には読まれず、読む実装の上では
      騒音になるため ── 変わる情報は Announcer(ライブリージョン)が受け持つ。
    -->
    <canvas id="gl" role="img" aria-label="高次元図形のリアルタイム可視化"></canvas>

    <!-- スクロール進捗バー(2px・シアン→マゼンタ) -->
    <div id="progress" aria-hidden="true"><div id="progress-bar"></div></div>

    <!--
      物語セクション。中身は src/ui/overlays.ts の buildNarrativeDOM() が
      src/ui/content.ts から生成して置き換える。ここに残す静的マークアップは
      JS を実行しないクローラ向けの最小限(h1 + 導入文)。
    -->
    <main id="narrative">
      <section class="chapter" data-role="prologue" data-align="left" data-ch="0">
        <div class="pin">
          <div class="chapter-inner">
            <h1 class="ch-en" lang="en" style="--len: 9">DIMENSION</h1>
            <h2 class="ch-title">見えない次元へ</h2>
            <p class="ch-body">
              人間の目は、三つの方向しか受けとれない。縦と、横と、奥ゆき。それでも数学は、その先へ進むことができる
              ── 見えないまま、正確に。スクロールするたび、世界に方向がひとつずつ加わっていく。
            </p>
          </div>
        </div>
      </section>
    </main>

    <!--
      HUD レイヤ。次元カウンタの値は overlays.ts が毎フレーム更新する。
      ギャラリーモードでは同じ場所に「EXHIBIT 02 / 04」が入れ替わりで立つ
      (器は src/ui/components/Hud.ts が足し、どちらを見せるかは CSS が決める)。
      .hud-row は高さ 34px のピルの中で、数字とラベルのベースラインを揃える器。
    -->
    <div id="hud" aria-hidden="true">
      <div class="hud-dim">
        <span class="hud-row">
          <span class="hud-value" id="hud-value">0.00</span>
          <span class="hud-unit">D</span>
          <span class="hud-sep"></span>
          <span class="hud-word" id="hud-word">DIMENSION</span>
        </span>
      </div>
    </div>

    <!--
      モード切替ナビ。初回のギャラリー入場までは出さない(body.has-gallery が付いてから)。
      物語へ戻ったあとも残り、いつでも往復できる導線になる。
    -->
    <nav id="mode-nav" aria-label="モード切替">
      <button type="button" class="nav-pill" data-mode="narrative">
        <span class="nav-jp">物語</span
        ><span class="nav-en" aria-hidden="true">STORY</span>
      </button>
      <button type="button" class="nav-pill" data-mode="gallery">
        <span class="nav-jp">ギャラリー</span
        ><span class="nav-en" aria-hidden="true">GALLERY</span>
      </button>
    </nav>

    <!--
      ギャラリーシェル。中身(タブ・パネル・解説)は src/core/gallery.ts が
      展示レジストリと content.ts の EXHIBIT_INFO から構築する。
      ここに置くのは器だけ ── 器の id が gallery.ts との契約になっている。
    -->
    <!--
      ギャラリーは物語と**排他**なので、ランドマークもここで交代する(Phase 14b)。
      物語モードでは #narrative が <main>、ギャラリーモードでは #narrative が
      visibility:hidden になるため、こちらが main を名乗らないと
      「ランドマークが <nav> だけの画面」になる。
    -->
    <main id="gallery" hidden>
      <div id="gallery-tabs" role="tablist" aria-label="展示の切り替え"></div>

      <!--
        role="group" で banner を打ち消す。<header> が sectioning content の
        子でないと role=banner(ページ級ランドマーク)にマップされ、
        モードの出入りでランドマークが出没してしまう。
      -->
      <header id="gallery-head" role="group" aria-labelledby="gallery-en">
        <p class="gh-index" id="gallery-index" lang="en">EXHIBIT 01</p>
        <h1 class="gh-en" id="gallery-en" lang="en">HOPF FIBRATION</h1>
        <p class="gh-jp" id="gallery-jp">ホップ・ファイブレーション</p>
        <p class="gh-tagline" id="gallery-tagline"></p>
        <button type="button" id="about-toggle" class="gh-about" aria-expanded="false">
          <span class="gh-about-jp">解説</span>
          <span class="gh-about-en" lang="en">ABOUT THIS</span>
        </button>
      </header>

      <!--
        is-collapsed が初期状態(Phase 11)。モバイルではパネルはボトムシートに
        なるので、開いたまま入場すると画面の 46% が作品ではなく操作卓で埋まる。
        つまみを一度押せば開く ── 開閉状態は作り直されない側(この器)が持つ。
        Panel.ts はこのクラスを読んで aria-expanded を組み立てる。
      -->
      <div id="gallery-panel" class="is-collapsed"></div>

      <aside id="gallery-drawer" aria-hidden="true" aria-labelledby="drawer-title">
        <div class="dw-head">
          <h3 class="dw-title" id="drawer-title"></h3>
          <button type="button" class="dw-close" id="drawer-close" aria-label="解説を閉じる">
            ✕
          </button>
        </div>
        <div class="dw-body" id="drawer-body"></div>
      </aside>
    </main>

    <!--
      描画品質セレクタ(AUTO・ULTRA・HIGH・BALANCED)。中身は src/core/quality.ts が
      構築する ── ここに置くのは器と、style.css が参照する id だけ。
    -->
    <div id="quality" lang="en"></div>

    <!--
      モード遷移の幕は src/ui/components/TransitionOverlay.ts が自分で生成する
      (Phase 9a で #mode-fade の単純な暗転から置き換え)。プリローダとカーソルも
      同様に main.ts がコンポーネントとして差し込むので、ここには器を置かない。
    -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

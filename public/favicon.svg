<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Phase 18 の回転子カーソル(割れた環×2、逆向き)を静止画へ写した意匠。
       ギャップの位相を外環 -50°/内環 120° に置くのは、正立だと「読み込み中」の記号に見えるため。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd8ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05060f"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#g)" stroke-width="4.5"
          stroke-linecap="round" stroke-dasharray="101 18.4" transform="rotate(-50 32 32)"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="url(#g)" stroke-width="3.2"
          opacity="0.85" stroke-linecap="round" stroke-dasharray="47.5 9" transform="rotate(120 32 32)"/>
</svg>
